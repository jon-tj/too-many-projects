<form [formGroup]="form" (ngSubmit)="save()">
  <label>
    Title
    <input formControlName="name" />
  </label>
  <label>
    Description
    <textarea formControlName="description" rows="4"></textarea>
  </label>
  <fieldset>
    <legend>Icon</legend>
    <app-project-icon [project]="{ icon: form.controls.icon.value, iconImage: form.controls.iconImage.value }" />
    <label>
      Upload an image
      <input type="file" accept="image/*" (change)="upload($event)" />
    </label>
    <p>Or choose an icon:</p>
    <nav aria-label="Project icons">
      @for (icon of icons; track icon) {
        <button
          class="transparent"
          type="button"
          [title]="icon"
          [class.active]="!form.controls.iconImage.value && form.controls.icon.value === icon"
          (click)="setIcon(icon, null)"
        >
          <app-icon [name]="icon" />
        </button>
      }
    </nav>
    <button
      class="transparent"
      type="button"
      [disabled]="!form.controls.icon.value && !form.controls.iconImage.value"
      (click)="setIcon(null, null)"
    >
      <span>Use default</span>
    </button>
  </fieldset>

  @if (message()) {
    <p role="status">{{ message() }}</p>
  }
  <footer>
    <button class="primary" type="submit" [disabled]="form.invalid || form.pristine || busy()">
      Save changes
    </button>
  </footer>
</form>

<section>
  <h2>Delete project</h2>
  <p>Deletes the project with all of its tasks and canvas. This cannot be undone.</p>
  <button class="primary" type="button" [disabled]="busy()" (click)="deleteProject()">
    Delete project
  </button>
</section>
