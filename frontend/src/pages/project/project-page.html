<h1>
  @if (project.value(); as current) {
    <app-project-icon [project]="current" />
  }
  {{ project.value()?.name ?? 'Loading project' }}
</h1>
@if (project.value()?.description; as description) {
  <p>{{ description }}</p>
}
@if (project.error()) {
  <p role="alert">This project is unavailable or you are not a member.</p>
}

<nav aria-label="Project views">
  <button class="transparent" type="button" routerLink="board" routerLinkActive="active">
    <app-icon name="grid_view" />
    <span>Board</span>
    <span class="badge">{{ project.value()?.taskCount ?? 0 }}</span>
  </button>
  <button class="transparent" type="button" routerLink="canvas" routerLinkActive="active">
    <app-icon name="account_tree" />
    <span>Canvas</span>
  </button>
  <button class="transparent" type="button" routerLink="members" routerLinkActive="active">
    <app-icon name="person" />
    <span>Members</span>
    <span class="badge">{{ project.value()?.memberCount ?? 0 }}</span>
  </button>
  <button class="transparent" type="button" routerLink="settings" routerLinkActive="active">
    <app-icon name="settings" />
    <span>Settings</span>
  </button>
</nav>

<router-outlet />
