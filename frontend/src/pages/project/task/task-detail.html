@if (task.isLoading()) {
  <p>Loading task...</p>
} @else if (task.error()) {
  <p role="alert">This task could not be found.</p>
} @else if (task.value(); as current) {
  @if (message()) {
    <p role="alert">{{ message() }}</p>
  }
  <app-task-form
    #taskForm
    [task]="current"
    [members]="members.value()"
    [currentUserId]="account.value()?.id ?? null"
    (save)="save($event)"
  >
    <button class="primary" type="submit" [disabled]="taskForm.form.invalid || taskForm.form.pristine || busy()">
      Save changes
    </button>
    <button class="transparent" type="button" (click)="backToBoard()">Cancel</button>
    <button class="transparent" type="button" [disabled]="busy()" (click)="deleteTask()">Delete task</button>
  </app-task-form>
}
