<form [formGroup]="form" (ngSubmit)="submit()">
  <h2>Choose a new password</h2>
  <p>You signed in with a temporary password. Pick your own to continue.</p>
  <label>
    Temporary password
    <input type="password" formControlName="currentPassword" autocomplete="current-password" />
  </label>
  <label>
    New password
    <input type="password" formControlName="newPassword" autocomplete="new-password" />
  </label>
  <label>
    Repeat new password
    <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
  </label>
  @if (error()) {
    <p role="alert">{{ error() }}</p>
  }
  <button class="primary" type="submit" [disabled]="form.invalid || busy()">Save password</button>
  <button class="transparent" type="button" (click)="logout()">Sign out</button>
</form>
