<header><h1>Settings</h1></header>
<section class="settings-section">
  <h2>Account</h2>
  <dl>
    <div>
      <dt>Name</dt>
      <dd>{{ account()?.displayName ?? 'Loading...' }}</dd>
    </div>
    <div>
      <dt>Username</dt>
      <dd>{{ account()?.userName ?? 'Loading...' }}</dd>
    </div>
    <div>
      <dt>Email</dt>
      <dd>{{ account()?.email ?? 'Loading...' }}</dd>
    </div>
  </dl>
</section>
<section class="settings-section">
  <h2>Change password</h2>
  <form [formGroup]="form" (ngSubmit)="changePassword()">
    <label>
      Current password
      <input type="password" formControlName="currentPassword" autocomplete="current-password" />
    </label>
    <label>
      New password
      <input type="password" formControlName="newPassword" autocomplete="new-password" />
    </label>
    @if (message()) {
      <p class="success" role="status">{{ message() }}</p>
    }
    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }
    <footer>
      <button class="primary" type="submit" [disabled]="form.invalid || busy()">
        {{ busy() ? 'Updating...' : 'Update password' }}
      </button>
    </footer>
  </form>
</section>
