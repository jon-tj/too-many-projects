<section class="debug-card" aria-labelledby="project-count-title">
	<header class="card-header">
		<div class="eyebrow"><span class="status-dot" [class.is-error]="error()"></span>DATABASE CHECK</div>
		<button class="refresh-button" type="button" (click)="refresh()" [disabled]="loading()" aria-label="Refresh project count" title="Refresh project count">
			<svg viewBox="0 0 24 24" aria-hidden="true" [class.spinning]="loading()">
				<path d="M20 7v5h-5M4 17v-5h5M5.6 9a7 7 0 0 1 11.8-2L20 12M4 12l2.6 5a7 7 0 0 0 11.8-2" />
			</svg>
		</button>
	</header>

	<div class="card-content" aria-live="polite" aria-atomic="true">
		<h1 id="project-count-title">Projects stored</h1>
		@if (loading()) {
			<p class="count loading-copy">Checking database...</p>
		} @else if (error()) {
			<p class="error-message" role="alert">{{ error() }}</p>
		} @else {
			<p class="count">{{ projectCount() }} <span>{{ projectCount() === 1 ? 'project' : 'projects' }}</span></p>
		}
	</div>

	<footer class="card-footer">
		<span>SUPABASE POSTGRESQL</span>
		<span>{{ loading() ? 'CONNECTING' : error() ? 'UNAVAILABLE' : 'CONNECTED' }}</span>
	</footer>
</section>
