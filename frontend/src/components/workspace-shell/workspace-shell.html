<div class="workspace-frame" (click)="closeAccountMenu()">
  <aside class="sidebar">
    <a class="wordmark" routerLink="/"><span class="brand-mark">T</span><span>TMP</span></a>

    <nav class="primary-nav" aria-label="Main navigation">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }"><app-icon name="dashboard" /><span>Dashboard</span></a>
      <div class="section-heading"><span>Projects</span><button class="transparent" type="button" aria-label="Create project" title="Create project" (click)="$event.stopPropagation(); openCreate()"><app-icon name="add" /></button></div>
      <div class="project-nav-list">
        @for (project of projects(); track project.id) {
          <a [routerLink]="['/projects', project.id, 'board']" routerLinkActive="is-active"><span class="project-mark" [attr.data-color]="$index % 5"><app-icon name="view_kanban"/></span><span class="project-link-name">{{ project.name }}</span><span class="badge">{{ project.taskCount }}</span></a>
        } @empty {
        }
      </div>
    </nav>

    <div class="sidebar-bottom" (click)="$event.stopPropagation()">
      <div class="account-menu-wrap">
        @if (accountMenuOpen()) {
          <div class="account-menu" role="menu">
            <button class="transparent" type="button" routerLink="/settings" role="menuitem" (click)="closeAccountMenu()"><app-icon name="settings" /><span>Settings</span></button>
            <button class="transparent" type="button" role="menuitem" (click)="logout()"><app-icon name="logout" /><span>Sign out</span></button>
          </div>
        }
        <button class="transparent" type="button" (click)="toggleAccountMenu()" [attr.aria-expanded]="accountMenuOpen()" aria-haspopup="menu" aria-label="Open account menu">
          <span class="avatar">{{ account()?.displayName?.charAt(0) ?? 'J' }}</span>
          <span class="profile-copy"><strong>{{ account()?.displayName ?? 'Account' }}</strong><small>{{ account()?.email ?? '' }}</small></span>
        </button>
      </div>
    </div>
  </aside>

  <main class="workspace-main"><router-outlet /></main>
</div>

<app-modal heading="Create a project" [(open)]="creating">
  <form [formGroup]="form" (ngSubmit)="createProject()">
    <label>
      Project name
      <input formControlName="name" placeholder="e.g. Website relaunch" autofocus />
    </label>
    <label>
      Description
      <textarea formControlName="description" rows="3" placeholder="Optional"></textarea>
    </label>
    @if (createError()) {
      <p role="alert">{{ createError() }}</p>
    }
    <footer>
      <button class="transparent" type="button" (click)="creating.set(false)">Cancel</button>
      <button class="primary" type="submit" [disabled]="form.invalid">Create project</button>
    </footer>
  </form>
</app-modal>
